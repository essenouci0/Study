name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Install dependencies
        run: npm install

      - name: Create Android project
        run: npx cap add android

      - name: Apply Study app icon
        run: |
          RES=android/app/src/main/res
          cp -r resources/android/res/. "$RES"/
          mkdir -p "$RES/values" "$RES/mipmap-anydpi-v26"
          cat > "$RES/values/ic_launcher_background.xml" <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">#000000</color>
          </resources>
          XML
          for n in ic_launcher ic_launcher_round; do
            cat > "$RES/mipmap-anydpi-v26/$n.xml" <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@mipmap/ic_launcher_foreground"/>
          </adaptive-icon>
          XML
          done
          rm -f "$RES/drawable-v24/ic_launcher_foreground.xml" "$RES/drawable/ic_launcher_background.xml"

      - name: Sync web assets
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Study.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Study-apk
          path: Study.apk

      - name: Publish release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: Study APK (آخر نسخة)
          body: "ملف APK للتجربة، حمّله وثبّته على هاتف أندرويد."
          files: Study.apk
          prerelease: false
