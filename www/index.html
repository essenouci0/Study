/* ===== visual layer (restored) ===== */
:root{--sh:rgba(255,255,255,.1);--gl:rgba(255,255,255,.16)}

<script>
/* ===== performance governor =====
   Picks a starting tier from the phone's specs, measures real frame times, and
   steps the visuals down (3 full -> 2 medium -> 1 light) whenever the phone
   struggles, so the app never freezes. The learned tier is remembered for 3 days. */
var PERF=3;
(function(){
 const R=document.documentElement,KEY='study_perf';
 const cores=navigator.hardwareConcurrency||4,mem=navigator.deviceMemory||4;

 function tick(t){requestAnimationFrame(tick);
  if(document.hidden){last=0;sum=0;n=0;t0=0;return}
  if(last){const d=t-last;if(d<400){sum+=d;n++}}last=t;
  if(!t0)t0=t;
  if(t-t0>=2000){const avg=n?sum/n:0;t0=t;sum=0;n=0;
   if(t>lock&&avg>23){if(++bad>=2)down()}else bad=0}}

 try{new PerformanceObserver(l=>{for(const e of l.getEntries())if(e.duration>180&&performance.now()>lock&&++lt>=3)down()}).observe({entryTypes:['longtask']});setInterval(()=>{lt=0},6000)}catch(e){}

})();

  LK*=Math.pow(.92,dt)}
 requestAnimationFrame(f)})();

// emoji -> grayscale only on the emoji themselves (cheap) instead of filtering whole screen layers
(function(){const E=/(?:[\u{1F300}-\u{1FAFF}\u{2600}-\u{2725}\u{2727}-\u{27BF}\u{2B00}-\u{2BFF}\u{1F1E6}-\u{1F1FF}][\uFE0F\u200D]*)+/gu,T0=/[\u{1F300}-\u{1FAFF}\u{2600}-\u{2725}\u{2727}-\u{27BF}\u{2B00}-\u{2BFF}]/u;let q=0;const pend=new Set(),SKIP='script,style,textarea,.emj,.tw,#fx,.liq';
 const ok=n=>{const p=n.parentElement;return p&&!p.closest(SKIP)&&T0.test(n.nodeValue)};
 const run=()=>{q=0;const L=[];
  pend.forEach(r=>{if(!r.isConnected)return;
   if(r.nodeType===3){if(ok(r))L.push(r);return}
   if(r.nodeType!==1||r.closest(SKIP))return;
   const w=document.createTreeWalker(r,4,{acceptNode:n=>ok(n)?1:3});let n;while(n=w.nextNode())L.push(n)});
  pend.clear();
  L.forEach(n=>{if(!n.isConnected)return;const t=n.nodeValue,f=document.createDocumentFragment();let i=0,m;E.lastIndex=0;while(m=E.exec(t)){if(m.index>i)f.append(t.slice(i,m.index));const e=document.createElement('span');e.className='emj';e.textContent=m[0];f.append(e);i=m.index+m[0].length}if(i<t.length)f.append(t.slice(i));n.replaceWith(f)})};
 new MutationObserver(ms=>{for(const m of ms){if(m.type==='characterData')pend.add(m.target);else m.addedNodes.forEach(n=>pend.add(n))}if(pend.size&&!q)q=requestAnimationFrame(run)}).observe(document.body,{childList:true,subtree:true,characterData:true});pend.add(document.body);run()})();
const _clk=()=>{const e=$('#clk');if(e)e.textContent=new Date().toLocaleTimeString('ar',{hour:'numeric',minute:'2-digit'})};
setInterval(_clk,5000);document.addEventListener('visibilitychange',_clk);
render();onboard();
